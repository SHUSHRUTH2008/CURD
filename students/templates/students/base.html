<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Records</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; }
    .container { max-width: 900px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; color: #2c3e50; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #2c3e50; color: #fff; }
    .btn { display: inline-block; padding: 7px 14px; border: none; border-radius: 4px; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn-add { background: #27ae60; } .btn-edit { background: #2980b9; }
    .btn-del { background: #c0392b; } .btn-back { background: #7f8c8d; }
    .msg { padding: 10px; background: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 10px; }
    form p { margin: 12px 0; } form label { display: block; font-weight: bold; margin-bottom: 4px; }
    form input { width: 100%; padding: 8px; box-sizing: border-box; }
    .errorlist { color: #c0392b; list-style: none; padding: 0; margin: 4px 0; }
  </style>
</head>
<body>
  <div class="container">
    {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
