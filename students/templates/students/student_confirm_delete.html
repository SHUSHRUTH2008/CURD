{% extends 'students/base.html' %}
{% block content %}
<h1>Delete Student</h1>
<p>Are you sure you want to delete <strong>{{ student.name }}</strong> ({{ student.roll_number }})?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-del">Yes, Delete</button>
  <a href="{% url 'student_list' %}" class="btn btn-back">Cancel</a>
</form>
{% endblock %}
